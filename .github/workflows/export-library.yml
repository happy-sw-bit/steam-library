name: Export Steam library

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 04:17 Berlin in winter, 05:17 in summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-library
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export library
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: "76561198076720644"
        run: python scripts/export_library.py

      - name: Commit library.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Library export $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
