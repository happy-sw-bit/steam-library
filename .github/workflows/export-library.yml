name: Export Steam library

on:
  schedule:
    - cron: "17 11 * * *"  # backup, 12:17 Berlin in winter, 13:17 in summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-library
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The cron is a backup for the external trigger. A scheduled run stops
      # here when library.json was already exported today (UTC).
      - name: Check for today's export
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          last=$(python3 -c 'import json; print(json.load(open("library.json"))["updatedAt"][:10])' 2>/dev/null || true)
          if [ "$last" = "$today" ]; then
            echo "Already exported today ($last). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Export library
        if: steps.fresh.outputs.skip != 'true'
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: "76561198076720644"
        run: python scripts/export_library.py

      - name: Commit library.json
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Library export $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
